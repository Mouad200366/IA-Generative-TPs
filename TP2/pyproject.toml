[project]
name = "tp2-modeles-generatifs"
version = "0.1.0"
description = "MNIST : classification, autoencodeur et VAE avec PyTorch"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torcheval==0.0.7",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "ipykernel>=6.29,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project]
name = "tp4-architecture-transformer"
version = "0.1.0"
description = "RNN, LSTM, Transformer, mini-GPT et mini-BERT pédagogiques"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.9.1",
  "transformers==5.24.1",
  "numpy==2.4.6",
  "pandas>=2.2,<4",
  "matplotlib>=3.10,<4",
  "ipykernel>=6.29,<8",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "pytest>=8,<10",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
